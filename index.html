           inView: s.l >= 0 && s.t >= 0 && s.r <= W && s.b <= H, covered: hits, inside, floor, labels: labelsOn ? [...document.querySelectorAll('#labels span')].filter(e => e.style.display !== 'none').length : 0, details: $('details').classList.contains('open') };
};
// ---------- menus, drawer / sheet ----------
const menus = { plans: $('pick'), tools: $('tbtn') };
function closeMenus(except) { for (const [id, btn] of Object.entries(menus)) if (id !== except) { $(id).classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); } }
function toggleMenu(id) { const open = !$(id).classList.contains('open'); closeMenus(id); $(id).classList.toggle('open', open); menus[id].setAttribute('aria-expanded', open); if (open) closeDetails(); }
function openDetails() { closeMenus(); const d = $('details'); d.classList.add('open'); d.inert = false; $('dbtn').setAttribute('aria-expanded', 'true'); fit(); }
function closeDetails() { const d = $('details'); if (!d.classList.contains('open')) return; d.classList.remove('open'); d.inert = true; $('dbtn').setAttribute('aria-expanded', 'false'); fit(); }
window.__openDetails = openDetails; window.__closeDetails = closeDetails;
$('pick').onclick = e => { e.stopPropagation(); toggleMenu('plans'); };
$('tbtn').onclick = e => { e.stopPropagation(); toggleMenu('tools'); };
$('dbtn').onclick = e => { e.stopPropagation(); $('details').classList.contains('open') ? closeDetails() : openDetails(); };
$('dclose').onclick = closeDetails;
$('fit').onclick = () => fit();
$('prev').onclick = () => load((curIdx + data.plans.length - 1) % data.plans.length);
$('next').onclick = () => load((curIdx + 1) % data.plans.length);
addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); closeDetails(); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu, #pick, #tbtn')) closeMenus(); });
// a tap (not a drag) on the model closes the drawer / sheet; orbiting still works while it is open
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350) closeDetails(); down = null; });
// swipe the sheet down to close (phone)
let sy = null; const dh = $('details');
dh.addEventListener('transitionend', e => { if (e.target === dh && e.propertyName === 'transform') fit(); });
dh.addEventListener('touchstart', e => { if (!e.target.closest('.body') || $('info').scrollTop <= 0) sy = e.touches[0].clientY; }, { passive: true });
dh.addEventListener('touchmove', e => { if (sy != null && e.touches[0].clientY - sy > 70) { sy = null; closeDetails(); } }, { passive: true });
const LB = $('labels');
function buildLabels() {
  LB.innerHTML = ''; if (!inside || !labelsOn || !cur) return;
  for (const r of cur.rooms || []) { if (r.f !== (cur.f2 != null ? floor : 1)) continue; const e = document.createElement('span'); e.textContent = r.t; e._p = P(r.x, r.y, r.z); LB.appendChild(e); }
}
const _v = new THREE.Vector3();
function placeLabels() {
  for (const e of LB.children) { _v.copy(e._p).project(camera); const on = _v.z < 1 && Math.abs(_v.x) < 1.05 && Math.abs(_v.y) < 1.05;
    e.style.display = on ? '' : 'none'; if (on) { e.style.left = ((_v.x + 1) / 2 * W) + 'px'; e.style.top = ((1 - _v.y) / 2 * H) + 'px'; } }
}
function setInside(v, f) {
  inside = v; if (f) floor = f; if (cur && cur.f2 == null) floor = 1; applyCut(); fit(inside ? inDir() : DIRS[viewDir]);
}
$('inside').onclick = () => setInside(!inside);
document.querySelectorAll('[data-floor]').forEach(b => b.onclick = () => setInside(true, +b.dataset.floor));
$('lbl').onclick = () => { labelsOn = !labelsOn; applyCut(); };
function updateBadge() {
  const n = skyOn + tubeOn, b = $('badge'); b.textContent = n; b.classList.toggle('show', n > 0);
}
function info(p) {
  $('dtitle').textContent = p.name;
  $('info').innerHTML = `<table>
  <tr class="cost"><td>Cost</td><td>${p.cost}</td></tr>
  <tr><td>Size</td><td>${p.size}</td></tr><tr><td>Area</td><td>${p.area}</td></tr><tr><td>Bedrooms</td><td>${p.beds}</td></tr><tr><td>Baths</td><td>${p.baths}</td></tr>
  <tr><td>Master bed</td><td>California king · ${p.king}</td></tr>
  <tr><td>Skylight</td><td>optional, ${p.sky}</td></tr><tr><td>Light tube</td><td>optional, ${p.tube}</td></tr><tr><td>3D</td><td>${p.note}</td></tr></table>
  <p>${data.built} Siding in every total: ${data.siding}.</p><p>${data.basis}</p>`;
}
function load(i) {
  const p = data.plans[i]; cur = p; curIdx = i; info(p); closeMenus(); window.__ready = '';
  $('pickname').innerHTML = `<span class="n">${i + 1}.</span> ${p.name}`; $('pick').title = 'Choose a plan (' + p.name + ')';
  status.style.display = 'block'; status.textContent = 'loading ' + p.name + '…';
  document.querySelectorAll('.pl').forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-current', j === i); });
  if (p.f2 == null) floor = 1;
  const want = i;
  loader.load(p.model, g => {
    if (want !== curIdx) return;                       // a newer plan was picked meanwhile
    if (model) { scene.remove(model); model.traverse(o => { o.geometry?.dispose?.(); }); }
    model = g.scene; scene.add(model);
    model.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { if (!NOCLIP.test(m.name || '')) m.clippingPlanes = [cut]; m.clipShadows = true; }); } });
    model.updateMatrixWorld(true); houseBox = computeHouseBox(); applyCut(); rebuildExtras(); status.style.display = 'none';
    fit(inside ? inDir() : DIRS[viewDir]);
    const extra = [p.furn, p.main].filter(Boolean);
    Promise.all(extra.map(u => loader.loadAsync(u).catch(e => { console.error(e); return null; }))).then(gs => {
      if (want !== curIdx) return;
      scene.remove(furnGroup); furnGroup.traverse(o => o.geometry?.dispose?.()); furnGroup = new THREE.Group(); scene.add(furnGroup);
      for (const g of gs) if (g) { g.scene.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { m.clippingPlanes = [cut]; }); } }); furnGroup.add(g.scene); }
      if (p.furn) model.traverse(o => { if (PLACEHOLDER.test(o.name || '')) o.visible = false; });
      window.__ready = p.id;
    });
  }, e => { if (e.total) status.textContent = `loading ${p.name}… ${Math.round(100 * e.loaded / e.total)}%`; },
     err => { status.textContent = 'could not load ' + p.model; console.error(err); });
}
fetch('plans.json').then(r => r.json()).then(d => {
  data = d; const menu = $('plans');
  d.plans.forEach((p, i) => { const b = document.createElement('button'); b.className = 'pl'; b.setAttribute('role', 'menuitem');
    b.innerHTML = `<img src="${p.thumb}" alt="" loading="lazy"><span>${i + 1}. ${p.name}<small>${p.size.replace(' · ', ', ')}</small></span>`; b.onclick = () => load(i); menu.appendChild(b); });
  const q = new URLSearchParams(location.search); const start = Math.max(0, d.plans.findIndex(p => p.id === q.get('plan')));
  if (q.get('sky')) skyOn = true; if (q.get('tube')) tubeOn = true; if (q.get('cut') && q.get('cut') !== 'full') { inside = true; floor = q.get('cut') === 'f2' ? 2 : 1; } if (q.get('inside')) inside = true; if (q.get('floor')) floor = +q.get('floor') === 2 ? 2 : 1; if (q.get('labels')) labelsOn = true;
  if (DIRS[q.get('view')]) viewDir = q.get('view');
  load(start);
  if (q.get('details')) openDetails();
});
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => view(b.dataset.view));
$('sky').onclick = () => { skyOn = !skyOn; rebuildExtras(); };
$('tube').onclick = () => { tubeOn = !tubeOn; rebuildExtras(); };
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); if (LB.children.length) placeLabels(); });
</script>
