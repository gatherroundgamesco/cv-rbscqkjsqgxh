<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabin + Addition (v4)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1d2126; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  model-viewer { width: 100vw; height: 100vh; height: 100dvh; --poster-color: #1d2126; }
  .hud { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top)); color: #fff; text-shadow: 0 1px 3px #000a; pointer-events: none; }
  .hud h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; } .hud p { font-size: 12px; margin: 0; opacity: .85; }
  .floors { position: fixed; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .floors button, .bar button { -webkit-appearance: none; appearance: none; padding: 9px 13px; border-radius: 18px; border: 1px solid #fff3;
            background: #000b; color: #fff; font-size: 13px; font-weight: 600; touch-action: manipulation; cursor: pointer; }
  .floors button.on { background: #e9b44c; color: #111; border-color: #e9b44c; }
  .floors button:disabled { opacity: .55; }
  .bar { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 8px; }
  #progress { position: absolute; left: 0; top: 0; height: 3px; background: #e9b44c; width: 0; transition: width .2s; }
  .ar-btn { position: absolute; right: 14px; bottom: calc(64px + env(safe-area-inset-bottom)); padding: 10px 16px; border-radius: 22px; border: 0;
            background: #fff; color: #111; font-weight: 600; font-size: 14px; box-shadow: 0 2px 8px #0006; }
</style>
</head>
<body>
<model-viewer id="mv" src="cabin_v4_full.glb" poster="poster.jpg" alt="Log cabin with two-storey addition"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="2500" rotation-per-second="12deg"
  interaction-prompt="auto" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  environment-image="kloofendal_48d_partly_cloudy_puresky_1k.hdr" skybox-image="kloofendal_48d_partly_cloudy_puresky_1k.hdr" skybox-height="1.7m"
  exposure="1.0" shadow-intensity="1" shadow-softness="0.8" tone-mapping="aces"
  camera-orbit="45deg 78deg 30m" camera-target="3m 2.5m 1.6m" field-of-view="38deg"
  min-camera-orbit="auto 5deg 6m" max-camera-orbit="auto 88deg 44m" interpolation-decay="120" loading="eager">
  <div id="progress" slot="progress-bar"></div>
  <button slot="ar-button" class="ar-btn">View in your space</button>
  <div class="bar">
    <button data-orbit="45deg 78deg 30m">Front</button>
    <button data-orbit="-135deg 76deg 30m">Rear</button>
    <button data-orbit="30deg 25deg 34m">Top</button>
  </div>
</model-viewer>
<div class="floors" role="group" aria-label="Floor view">
  <button class="on" data-src="cabin_v4_full.glb" data-target="3m 2.5m 1.6m">Full house</button>
  <button data-src="cabin_v4_floor2_open.glb" data-target="3.5m 3.2m -1.2m" data-orbit="35deg 40deg 27m">Floor 2 open</button>
  <button data-src="cabin_v4_floor1_open.glb" data-target="3m 0.8m 1.6m" data-orbit="35deg 38deg 30m">Floor 1 open</button>
</div>
<div class="hud"><h1>Cabin + Addition</h1><p>Drag to orbit · pinch to zoom · floors: top right</p></div>
<script>
  // Floor toggle = swap between three pre-cut GLBs (roof / upper floor removed in the model file itself).
  // One model is in memory at a time (safe on iPhone Safari); the others are prefetched into the HTTP cache after first load.
  const mv = document.getElementById('mv'), btns = [...document.querySelectorAll('.floors button')];
  const bar = document.getElementById('progress');
  mv.addEventListener('progress', e => { bar.style.opacity = 1; bar.style.width = (e.detail.totalProgress * 100) + '%'; if (e.detail.totalProgress === 1) bar.style.opacity = 0; });
  let pending = null, prefetched = false;
  mv.addEventListener('load', () => {
    btns.forEach(b => b.disabled = false);
    if (pending) { mv.cameraTarget = pending.target; if (pending.orbit) mv.cameraOrbit = pending.orbit; mv.jumpCameraToGoal(); pending = null; }
    if (!prefetched) { prefetched = true; setTimeout(() => btns.slice(1).forEach(b => fetch(b.dataset.src).catch(() => {})), 1500); }
  });
  btns.forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('on')) return;
    btns.forEach(x => { x.classList.toggle('on', x === b); x.disabled = true; });
    mv.autoRotate = false;
    pending = { target: b.dataset.target, orbit: b.dataset.orbit || mv.getCameraOrbit().toString() };
    mv.src = b.dataset.src;
  }));
  document.querySelectorAll('.bar button').forEach(b => b.addEventListener('click', () => { mv.cameraOrbit = b.dataset.orbit; mv.autoRotate = false; }));
</script>
</body>
</html>
